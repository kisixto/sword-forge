<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>검 강화 대장간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽은 모루 위의 검과 강화 조작, 오른쪽은 강화표 / 기록 탭. 상점은 버튼을 눌러 들어가는 팝업. 좁은 화면에서는 세로로 쌓는다. */
:root {
  --bg: #1b2530;
  --panel: #222e3b;
  --panel-2: #2b3a4a;
  --line: #3a4c60;
  --text: #e9eef3;
  --muted: #9db0c2;
  --copper: #e58f50;
  --copper-ink: #2a1608;
  --gold: #f2c14e;
  --ok: #6ad1a0;
  --bad: #f2705f;
  --f-display: 'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --blade-a: #8a8f98;
  --blade-b: #5d626b;
  --guard: #6b4f3a;
  --glow: #9aa4b1;
  --lv: 0;
  --halo: 0.08;
  --rune: 0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-inline: clamp(16px, 4vw, 32px);
  padding-block: 20px 48px;
}
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.purse { display: flex; align-items: baseline; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; }
.purse .label { color: var(--muted); font-size: 13px; }
.purse b { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.purse .unit { color: var(--gold); font-weight: 700; }

.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.forge { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: 330px; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(180deg, #202c39 0%, #1a242f 100%); overflow: hidden; }
.halo { position: absolute; inset: 0; background: radial-gradient(circle at 50% 52%, var(--glow), transparent 58%); opacity: var(--halo); transition: opacity .4s; pointer-events: none; }
.flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, #fff, transparent 65%); }
.fxc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage[data-fx="strike"] .flash { animation: flashhit .25s ease-out; }
.stage[data-fx="win"] .flash { animation: flash .6s ease-out; }
.stage[data-fx="save"] .flash { animation: flashbad .5s ease-out; background: radial-gradient(circle at 50% 50%, var(--bad), transparent 65%); }
.stage[data-fx="break"] { animation: quake .5s ease-out; }
.stage[data-fx="break"] .flash { animation: flashbad .8s ease-out; background: radial-gradient(circle at 50% 50%, var(--bad), transparent 70%); }
.pedestal { position: absolute; bottom: 14px; left: 50%; width: 190px; height: 28px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #3a4c60, #131b24 70%); }
.sword-wrap { position: relative; height: 296px; margin-bottom: 30px; transform-origin: 50% 100%; }
.sword { height: 100%; width: auto; display: block; filter: drop-shadow(0 0 calc(2px + var(--lv) * 1.1px) var(--glow)); }
.runes { opacity: var(--rune); }
.stage.gold .sword { animation: shimmer 2.4s ease-in-out infinite; }
@keyframes shimmer { 0%, 100% { filter: drop-shadow(0 0 22px var(--glow)) brightness(1); } 50% { filter: drop-shadow(0 0 36px var(--glow)) brightness(1.2); } }
.sword-wrap.strike { animation: strike .28s ease-out; }
.sword-wrap.win { animation: pop .5s ease-out; }
.sword-wrap.lose { animation: shake .45s ease-in-out; }
.sword-wrap.gone { opacity: 0; }
.sword-wrap.enter { animation: enter .5s ease-out; }
.banner { position: absolute; left: 12px; right: 12px; top: 14px; text-align: center; font-family: var(--f-display); font-size: 22px; opacity: 0; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.banner.ok { color: var(--ok); }
.banner.bad { color: var(--bad); }
.banner.show { animation: rise 1.5s ease-out forwards; }

@keyframes flashhit { 0% { opacity: .22; } 100% { opacity: 0; } }
@keyframes flash { 0% { opacity: .8; } 100% { opacity: 0; } }
@keyframes flashbad { 0% { opacity: .45; } 100% { opacity: 0; } }
@keyframes strike { 0% { transform: translateY(0); } 40% { transform: translateY(8px) scaleY(.985); } 100% { transform: translateY(0); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-2deg); } 40% { transform: translateX(8px) rotate(2deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
@keyframes quake { 0%, 100% { transform: translate(0, 0); } 15% { transform: translate(-7px, 4px); } 30% { transform: translate(6px, -5px); } 45% { transform: translate(-5px, -3px); } 60% { transform: translate(4px, 4px); } 80% { transform: translate(-2px, 2px); } }
@keyframes enter { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 15% { opacity: 1; transform: translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.stage.fxoff, .stage.fxoff * { animation: none !important; }
.stage.fxoff .banner.show { opacity: 1; }

.controls { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.nameplate { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tier { margin: 0; color: var(--muted); font-size: 14px; }
.lvl { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 54px; line-height: 1; color: var(--glow); font-variant-numeric: tabular-nums; }
.gauge { display: flex; flex-direction: column; gap: 6px; }
.gauge-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.gauge-head .k { color: var(--muted); font-size: 13px; }
.gauge-head .v { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--copper), var(--gold)); transition: width .35s; }
.note { color: var(--muted); font-size: 13px; margin: 0; min-height: 1.5em; }
.conseq { font-size: 13px; margin: 0; color: var(--muted); }
.conseq.safe { color: var(--ok); }

.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: #3a3524; color: var(--gold); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.chip .n { font-variant-numeric: tabular-nums; font-weight: 700; }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 11px 14px; cursor: pointer; font-weight: 500; transition: filter .15s, transform .05s; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 8px 12px; font-size: 13px; }
.btn.primary { background: var(--copper); border-color: var(--copper); color: var(--copper-ink); font-weight: 700; font-size: 17px; padding: 14px 16px; }
.btn.shop { border-color: var(--gold); color: var(--gold); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.autobox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.autobox label { color: var(--muted); font-size: 13px; }
select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
.autonote { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; min-height: 1.5em; }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 14px 8px; cursor: pointer; color: var(--muted); font-weight: 700; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--copper); }
.pane { padding: 6px 18px 18px; }
.scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
tr.now td { background: #3a3524; color: var(--gold); font-weight: 700; }
tr.sec td { text-align: left; background: var(--panel-2); color: var(--muted); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; padding-block: 14px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .v { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow-y: auto; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; gap: 10px; }
.log li:last-child { border-bottom: 0; }
.log .tag { flex: none; width: 38px; font-weight: 700; }
.t-win .tag { color: var(--ok); } .t-fail .tag, .t-break .tag { color: var(--bad); } .t-sell .tag { color: var(--gold); } .t-buy .tag { color: var(--copper); }
.empty { color: var(--muted); padding: 16px 0; margin: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }
.link.armed { color: var(--bad); }

.modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 12, 17, .72); }
.sheet { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.sheet-gold { margin-left: auto; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.sheet-body { padding: 4px 18px 18px; }
.shopnote { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: #3a3524; color: var(--gold); font-size: 13px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item h3 { margin: 0; font-size: 15px; }
.item p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.item .own { color: var(--gold); font-size: 12px; font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }
.buy { min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>검 강화 대장간</h1>
      <p>강화에 실패하면 검이 부서집니다. 어디서 멈출지 정하세요.</p>
    </div>
    <div class="tools">
      <button type="button" class="btn small" id="fxBtn" aria-pressed="true">이펙트 켜짐</button>
      <button type="button" class="btn small" id="mute" aria-pressed="false">효과음 켜짐</button>
      <div class="purse" aria-label="보유 골드"><span class="label">보유 골드</span><b id="gold">0</b><span class="unit">G</span></div>
    </div>
  </header>

  <main class="grid">
    <section class="forge" aria-label="대장간">
      <div class="stage" id="stage" data-fx="">
        <div class="halo"></div>
        <div class="pedestal"></div>
        <div class="sword-wrap" id="wrap">
          <svg class="sword" viewBox="0 0 120 340" aria-hidden="true">
            <defs>
              <linearGradient id="gBlade" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" style="stop-color:var(--blade-b)"></stop>
                <stop offset=".5" style="stop-color:var(--blade-a)"></stop>
                <stop offset="1" style="stop-color:var(--blade-b)"></stop>
              </linearGradient>
            </defs>
            <path d="M60 6 L76 44 L76 236 L44 236 L44 44 Z" fill="url(#gBlade)"></path>
            <path d="M60 16 L60 230" stroke="rgba(0,0,0,.25)" stroke-width="3" fill="none"></path>
            <g class="runes" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--glow)">
              <path d="M51 70 L56 79 L51 88"></path>
              <path d="M69 98 L64 107 L69 116"></path>
              <path d="M51 132 L56 141 L51 150"></path>
              <path d="M69 164 L64 173 L69 182"></path>
              <path d="M51 196 L56 205 L51 214"></path>
            </g>
            <rect x="18" y="236" width="84" height="14" rx="3" style="fill:var(--guard)"></rect>
            <rect x="53" y="250" width="14" height="58" rx="4" fill="#4a3427"></rect>
            <path d="M53 262 L67 258 M53 274 L67 270 M53 286 L67 282 M53 298 L67 294" stroke="rgba(0,0,0,.35)" stroke-width="2" fill="none"></path>
            <circle cx="60" cy="318" r="12" style="fill:var(--guard)"></circle>
          </svg>
        </div>
        <canvas class="fxc" id="fxc" aria-hidden="true"></canvas>
        <div class="flash"></div>
        <div class="banner" id="banner" aria-live="polite"></div>
      </div>

      <div class="controls">
        <div class="nameplate">
          <p class="tier" id="tierName">낡은 검</p>
          <h2 class="lvl" id="lvl">+0</h2>
        </div>

        <div class="gauge">
          <div class="gauge-head"><span class="k">성공 확률</span><span class="v" id="rateNum">97%</span></div>
          <div class="track"><div class="fill" id="rateFill"></div></div>
          <p class="note" id="rateNote"></p>
        </div>
        <p class="conseq" id="conseq"></p>

        <div class="toggles" id="toggles" role="group" aria-label="사용할 아이템">
          <button type="button" class="chip" data-use="dust" aria-pressed="false">행운의 가루 <span class="n">×0</span></button>
          <button type="button" class="chip" data-use="coupon" aria-pressed="false">할인 쿠폰 <span class="n">×0</span></button>
          <button type="button" class="chip" data-use="charm" aria-pressed="false">수호 부적 <span class="n">×0</span></button>
        </div>

        <button type="button" class="btn primary" id="enhance">강화하기</button>
        <div class="row2">
          <button type="button" class="btn" id="sell">검 판매</button>
          <button type="button" class="btn shop" id="openShop" aria-haspopup="dialog">상점 들어가기</button>
        </div>

        <div class="autobox" id="autoBox" hidden>
          <label for="target">목표 레벨</label>
          <select id="target"></select>
          <button type="button" class="btn" id="autoBtn">자동 강화 시작</button>
          <p class="autonote" id="autoNote"></p>
        </div>
      </div>
    </section>

    <section class="side" aria-label="강화표와 기록">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tab-table" aria-selected="true" aria-controls="pane-table" data-tab="table">강화표</button>
        <button type="button" class="tab" role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log" data-tab="log">기록</button>
      </div>
      <div class="pane" id="pane-table" role="tabpanel" aria-labelledby="tab-table">
        <div class="scroll"><table id="table"></table></div>
      </div>
      <div class="pane" id="pane-log" role="tabpanel" aria-labelledby="tab-log" hidden>
        <div class="stats" id="stats"></div>
        <ul class="log" id="log"></ul>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>진행 상황은 이 브라우저에 자동 저장됩니다.</span>
    <button type="button" class="link" id="reset">처음부터 다시 시작</button>
  </footer>
</div>

<div class="modal" id="shopModal" role="dialog" aria-modal="true" aria-labelledby="shopTitle" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="shopTitle">대장간 상점</h2>
      <span class="sheet-gold"><span id="shopGold">0</span> G</span>
      <button type="button" class="btn small" id="closeShop">닫기</button>
    </div>
    <div class="sheet-body">
      <p class="shopnote" id="shopNote" hidden></p>
      <div id="shopList"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var KEY = 'sword-forge-v2';
  var MAX = 20;
  var STRIKE_MS = 620;
  var RESPAWN_MS = 760;

  var TIERS = [
    { min: 0,  name: '낡은 검',   a: '#8a8f98', b: '#5d626b', guard: '#6b4f3a', glow: '#9aa4b1' },
    { min: 1,  name: '철검',      a: '#c3cad3', b: '#8590a0', guard: '#7a5a40', glow: '#b8c4d4' },
    { min: 4,  name: '강철검',    a: '#dfe8f2', b: '#9fb3c9', guard: '#b07a3d', glow: '#9fd0ff' },
    { min: 7,  name: '미스릴 검', a: '#b9f0ff', b: '#52b8e0', guard: '#d9a441', glow: '#5cd6ff' },
    { min: 10, name: '룬 검',     a: '#d6c2ff', b: '#8c6bf0', guard: '#e7c15a', glow: '#a98bff' },
    { min: 13, name: '용린 검',   a: '#ffd2a8', b: '#ee6a3a', guard: '#f2c14e', glow: '#ff8a4a' },
    { min: 16, name: '성광 검',   a: '#fff6c7', b: '#f2c14e', guard: '#fff0a8', glow: '#ffe27a' },
    { min: 19, name: '신화의 검', a: '#ffffff', b: '#7ff0d0', guard: '#ffffff', glow: '#7ff0d0' }
  ];

  var GOLD_TIERS = [
    { min: 0,  name: '금검',        a: '#fff1a8', b: '#d9962b', guard: '#fff6c9', glow: '#ffd24a' },
    { min: 7,  name: '순금 검',     a: '#fff6c2', b: '#e8a838', guard: '#ffe9a0', glow: '#ffdd66' },
    { min: 14, name: '황금 용검',   a: '#ffe9a8', b: '#f07f2a', guard: '#fff3c4', glow: '#ffb347' },
    { min: 20, name: '전설의 금검', a: '#ffffff', b: '#ffd24a', guard: '#ffffff', glow: '#fff2a8' }
  ];

  var SHOP = [
    { id: 'dust',    name: '행운의 가루', desc: '다음 강화 1회의 성공 확률 +10%p', kind: 'item',    price: function () { return 4000; } },

    S.gold += price;
    logAdd('sell', '판매', (S.tier === 1 ? '금검 +' + S.level + ' 을 ' : '+' + S.level + ' 검을 ') + fmt(price) + ' G에 팔았습니다' + (S.tier === 1 ? '. 새 금검(금 +0)을 받았습니다' : ''));
    say('+' + fmt(price) + ' G', 'ok');
    S.level = 0;
    S.stats.swords += 1;
    sfx.sell();
    refresh(); renderSword(); fx('enter');
  }

  function buy(id) {
    var it = SHOP.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    if (id === 'furnace' && S.furnace >= 10) return;
    if (id === 'auto' && S.autoOwned) return;
    var p = priceOf(it);
    if (S.gold < p) { sfx.poor(); return; }
    S.gold -= p;
    if (it.kind === 'item') S.items[id] += 1;
    if (id === 'furnace') S.furnace += 1;
    if (id === 'auto') S.autoOwned = true;
    logAdd('buy', '구매', it.name + ' 구매 (-' + fmt(p) + ' G)');
    sfx.buy();
    refresh();
  }

  /* 금검 단계에서 골드가 바닥나 강화도 판매도 못 할 때: 금 +0 강화 3회분까지만 채워 줍니다 */
  function support() {
    var add = Math.max(0, costOf(0) * 3 - S.gold);
    S.gold += add;
    logAdd('buy', '지원', '대장장이가 ' + fmt(add) + ' G를 지원했습니다');
    say('+' + fmt(add) + ' G 지원', 'ok');
    sfx.buy();
    refresh();
  }

  function restartGame() {
    var m = S.mute, fxk = S.fx;
    epoch += 1; busy = false;
    stopAuto('');
    S = def(); S.mute = m; S.fx = fxk;
    save(); renderAll(); fx('enter');
    say('새 검을 받았습니다', 'ok');
  }

  /* ---------- 자동 강화 ---------- */
  function reached(target) { return S.tier !== autoTier || S.level >= target; }
  function startAuto() {
    var target = +$('#target').value;
    if (S.level >= target) { $('#autoNote').textContent = '이미 목표 레벨 이상입니다.'; return; }
    autoOn = true;
    autoTier = S.tier;
    $('#autoNote').textContent = '목표 ' + (S.tier === 1 ? '금 +' : '+') + target + ' 까지 강화 중… 실패하면 새 검으로 이어서 도전합니다.';
    renderForge();
    autoStep(target);
  }
  function autoStep(target) {
    if (!autoOn) return;
    if (reached(target)) { stopAuto('목표 레벨에 도달했습니다.'); return; }
    attempt(function (r) {
      if (!autoOn) return;
      if (r.status === 'poor') stopAuto('골드가 부족해 멈췄습니다. 필요 ' + fmt(r.need) + ' G');
      else if (r.status === 'max') stopAuto('최대 강화에 도달했습니다.');
      else if ((r.status === 'win' || r.status === 'convert') && reached(target)) stopAuto('목표 레벨에 도달했습니다.');
      else autoTimer = setTimeout(function () { autoStep(target); }, 260);
    });
  }
  function stopAuto(note) {
    autoOn = false;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    $('#autoNote').textContent = note || '';
    renderForge();
  }

  /* ---------- 렌더 ---------- */
  function refresh() { save(); renderTop(); renderForge(); renderShop(); renderTable(); renderRecords(); }
  function renderTop() { $('#gold').textContent = fmt(S.gold); $('#shopGold').textContent = fmt(S.gold); }

  function renderSword() {
    var t = tierOf(S.level), s = $('#stage').style;
    s.setProperty('--blade-a', t.a);
    s.setProperty('--blade-b', t.b);
    s.setProperty('--guard', t.guard);
    s.setProperty('--glow', t.glow);
    s.setProperty('--lv', String(S.tier === 1 ? S.level + 8 : S.level));
    s.setProperty('--halo', String(S.tier === 1 ? Math.min(0.8, 0.4 + S.level * 0.02) : Math.min(0.55, 0.06 + S.level * 0.026)));
    s.setProperty('--rune', S.tier === 1 ? String(Math.min(1, 0.5 + S.level * 0.025)) : (S.level >= 10 ? String(Math.min(1, 0.35 + (S.level - 10) * 0.07)) : '0'));
    $('#lvl').style.color = t.glow;
    $('#stage').classList.toggle('gold', S.tier === 1);
  }

  function renderForge() {
    var l = S.level, t = tierOf(l), maxed = S.tier === 1 && l >= MAX, locked = busy || autoOn;
    $('#lvl').textContent = (S.tier === 1 ? '금 +' : '+') + l;
    $('#tierName').textContent = t.name;

    var rp = rateParts(l), cost = costNow(l), poor = S.gold < cost, bk = bankrupt();
    $('#rateNum').textContent = maxed ? '—' : rp.total + '%';
    $('#rateFill').style.width = (maxed ? 100 : rp.total) + '%';
    var note = '';
    if (maxed) note = '전설의 금검이 완성됐습니다. 판매해서 보상을 받으세요.';
    else if (bk) note = '골드가 바닥나 강화할 수 없습니다.';
    else if (poor) note = '골드가 모자랍니다. 검을 팔아 골드를 마련하세요.';
    else note = '기본 ' + rp.b + '%' + (rp.f ? ' + 화로 ' + rp.f + '%p' : '') + (rp.d ? ' + 가루 ' + rp.d + '%p' : '');
    $('#rateNote').textContent = note;

    var c = $('#conseq');
    c.classList.remove('safe');
    if (maxed) { c.textContent = '더 이상 강화할 수 없습니다. 지금 팔면 ' + fmt(sellPrice(l)) + ' G를 받습니다.'; c.classList.add('safe'); }
    else if (active('charm')) { c.textContent = '수호 부적이 실패했을 때 검이 부서지는 것을 한 번 막아 줍니다.'; c.classList.add('safe'); }
    else if (S.tier === 1) c.textContent = '실패하면 금검이 부서지고 새 금검(금 +0)을 받습니다.' + (l >= 1 ? ' 지금 팔면 ' + fmt(sellPrice(l)) + ' G를 받습니다.' : '');
    else if (l === 0) c.textContent = '실패하면 검이 부서지고 새 검을 받습니다.';
    else c.textContent = '실패하면 검이 부서집니다. 지금 팔면 ' + fmt(sellPrice(l)) + ' G를 받습니다.';

    var btn = $('#enhance');
    if (busy) { btn.textContent = '단련 중…'; btn.disabled = true; }
    else if (maxed) { btn.textContent = '최대 강화 달성 · 판매해서 보상 받기'; btn.disabled = true; }
    else if (bk) { btn.textContent = S.tier === 1 ? '골드가 바닥났어요 · 지원금 받기' : '골드가 바닥났어요 · 새로 시작'; btn.disabled = autoOn; }
    else if (poor) { btn.textContent = '골드 부족 · 필요 ' + fmt(cost) + ' G'; btn.disabled = true; }
    else { btn.textContent = '강화하기 · ' + fmt(cost) + ' G' + (active('coupon') ? ' (할인 적용)' : ''); btn.disabled = autoOn; }

    var sb = $('#sell');
    var noSell = l < 1;
    sb.textContent = noSell ? (S.tier === 1 ? '금검 판매 (금 +1부터)' : '검 판매 (+1 이상부터)') : (S.tier === 1 ? '금검 판매 +' + fmt(sellPrice(l)) + ' G' : '검 판매 +' + fmt(sellPrice(l)) + ' G');
    sb.disabled = noSell || locked;

    document.querySelectorAll('#toggles .chip').forEach(function (b) {
      var k = b.getAttribute('data-use');
      b.querySelector('.n').textContent = '×' + S.items[k];
      b.disabled = S.items[k] <= 0 || busy;
      b.setAttribute('aria-pressed', active(k) ? 'true' : 'false');
    });

    $('#autoBox').hidden = !S.autoOwned;
    $('#autoBtn').textContent = autoOn ? '자동 강화 중지' : '자동 강화 시작';
    $('#autoBtn').disabled = busy && !autoOn;

    var m = $('#mute');
    m.textContent = S.mute ? '효과음 꺼짐' : '효과음 켜짐';
    m.setAttribute('aria-pressed', S.mute ? 'true' : 'false');
    var fb = $('#fxBtn');
    fb.textContent = S.fx ? '이펙트 켜짐' : '이펙트 꺼짐';
    fb.setAttribute('aria-pressed', S.fx ? 'true' : 'false');
    $('#stage').classList.toggle('fxoff', !S.fx);
  }

  function renderShop() {
    var html = '';
    SHOP.forEach(function (it) {
      var p = priceOf(it), label, dis = false, own = '';
      if (it.kind === 'item') own = '<span class="own">보유 ' + S.items[it.id] + '</span>';
      if (it.id === 'furnace') own = '<span class="own">Lv ' + S.furnace + ' / 10</span>';
      if (it.id === 'furnace' && S.furnace >= 10) { label = '최대'; dis = true; }
      else if (it.id === 'auto' && S.autoOwned) { label = '보유 중'; dis = true; }
      else { label = fmt(p) + ' G'; dis = S.gold < p; }
      html += '<div class="item"><div><h3>' + it.name + own + '</h3><p>' + it.desc + '</p></div>' +
        '<button type="button" class="btn buy" data-buy="' + it.id + '"' + (dis ? ' disabled' : '') + '>' + label + '</button></div>';
    });
    $('#shopList').innerHTML = html;
    var sn = $('#shopNote');
    sn.hidden = !S.goldMade && S.tier !== 1;
    sn.textContent = '금검이 된 뒤라 모든 가격이 1.5배이고, 소모품(가루, 쿠폰, 부적)은 8배가 더해집니다.';
  }

  function renderTable() {
    var h = '<thead><tr><th>레벨</th><th>성공</th><th>비용</th><th>판매가</th></tr></thead><tbody>';
    [0, 1].forEach(function (tr) {
      var pre = tr === 1 ? '금 +' : '+';
      h += '<tr class="sec"><td colspan="4">' + (tr === 1 ? '금검 (확률 낮음 · 금 +0은 판매 불가)' : '일반 검') + '</td></tr>';
      for (var l = 0; l < MAX; l++) {
        var r = Math.min(100, rateOf(l, tr) + S.furnace), now = S.tier === tr && l === S.level;
        h += '<tr' + (now ? ' class="now"' : '') + '><td>' + pre + l + ' → ' + pre + (l + 1) + '</td><td>' + r + '%</td><td>' +
          fmt(costOf(l, tr)) + ' G</td><td>' + (l === 0 ? '—' : fmt(sellPrice(l, tr)) + ' G') + '</td></tr>';
      }
      if (tr === 0) h += '<tr><td>+' + MAX + '</td><td colspan="3">금검 +0으로 진화 (판매 불가)</td></tr>';
      else h += '<tr' + (S.tier === 1 && S.level >= MAX ? ' class="now"' : '') + '><td>금 +' + MAX + '</td><td>—</td><td>—</td><td>' + fmt(sellPrice(MAX, 1)) + ' G</td></tr>';
    });
    $('#table').innerHTML = h + '</tbody>';
  }

  function renderRecords() {
    var st = S.stats, rate = st.tries ? Math.round(st.wins / st.tries * 100) + '%' : '—';
    var cells = [['강화 시도', st.tries], ['성공률', rate], ['최고 레벨', st.best > MAX ? '금 +' + (st.best - MAX) : '+' + st.best], ['부서진 검', st.breaks], ['쓴 골드', fmt(st.spent)], ['사용한 검', st.swords], ['금검 진화', st.golds]];
    $('#stats').innerHTML = cells.map(function (c) {
      return '<div class="stat"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
    }).join('');
    $('#log').innerHTML = S.log.length ? S.log.map(function (e) {
      return '<li class="t-' + e.type + '"><span class="tag">' + e.tag + '</span><span>' + e.text + '</span></li>';
    }).join('') : '<li class="empty">아직 기록이 없습니다. 첫 강화를 해 보세요.</li>';
  }

  function renderAll() { renderTop(); renderForge(); renderShop(); renderTable(); renderRecords(); renderSword(); }

  /* ---------- 상점 팝업 ---------- */
  function openShop() {
    sfx.tick();
    $('#shopModal').hidden = false;
    $('#closeShop').focus();
  }
  function closeShop() {
    if ($('#shopModal').hidden) return;
    $('#shopModal').hidden = true;
    $('#openShop').focus();
  }

  /* ---------- 이벤트 ---------- */
  (function init() {
    var sel = $('#target'), o = '';
    for (var i = 1; i <= MAX; i++) o += '<option value="' + i + '"' + (i === 10 ? ' selected' : '') + '>+' + i + '</option>';
    sel.innerHTML = o;
    sizeCanvas();
    window.addEventListener('resize', sizeCanvas);

    $('#enhance').addEventListener('click', function () {
      if (bankrupt()) { if (S.tier === 1) support(); else restartGame(); return; }
      attempt();
    });
    $('#sell').addEventListener('click', sell);
    $('#openShop').addEventListener('click', openShop);
    $('#closeShop').addEventListener('click', closeShop);
    $('#shopModal').addEventListener('click', function (e) { if (e.target === $('#shopModal')) closeShop(); });
    document.addEventListener('keydown', function (e) {
      if ($('#shopModal').hidden) return;
      if (e.key === 'Escape') { closeShop(); return; }
      if (e.key === 'Tab') {
        var f = [].slice.call($('#shopModal').querySelectorAll('button:not(:disabled)'));
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    $('#shopList').addEventListener('click', function (e) {
      var b = e.target.closest('[data-buy]'); if (!b || b.disabled) return;
      buy(b.getAttribute('data-buy'));
    });
    $('#autoBtn').addEventListener('click', function () { if (autoOn) stopAuto('직접 중지했습니다.'); else startAuto(); });
    $('#toggles').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b || b.disabled) return;
      var k = b.getAttribute('data-use');
      S.use[k] = !S.use[k];
      sfx.tick();
      save(); renderForge();
    });
    $('#fxBtn').addEventListener('click', function () {
      S.fx = !S.fx;
      save(); renderForge();
    });
    $('#mute').addEventListener('click', function () {
      S.mute = !S.mute;
      save(); renderForge();
      sfx.tick();
    });
    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        var name = t.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', x === t ? 'true' : 'false'); });
        ['table', 'log'].forEach(function (n) { $('#pane-' + n).hidden = n !== name; });
      });
    });

    var armed = null, rb = $('#reset');
    rb.addEventListener('click', function () {
      if (!armed) {
        rb.textContent = '정말 초기화할까요? 한 번 더 누르면 모두 지워집니다';
        rb.classList.add('armed');
        armed = setTimeout(function () { armed = null; rb.textContent = '처음부터 다시 시작'; rb.classList.remove('armed'); }, 4000);
      } else {
        clearTimeout(armed); armed = null;
        rb.textContent = '처음부터 다시 시작'; rb.classList.remove('armed');
        restartGame();
      }
    });

    renderAll();
  })();
})();
</script>

</body>
</html>
